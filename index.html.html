<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🇦🇷 → 🇨🇱 Conversor Banco Falabella</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f5f7;margin:0;padding:20px;color:#222}
.app{max-width:430px;margin:20px auto;background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #0002}
h1{margin:0;font-size:27px}.sub{color:#666;margin:6px 0 25px}
label{font-weight:700;display:block;margin-bottom:8px}
input{width:100%;box-sizing:border-box;padding:15px;font-size:26px;border:2px solid #ddd;border-radius:14px;outline:0}
input:focus{border-color:#555}
.result{margin-top:18px;padding:20px;border-radius:17px;background:#f0f8f2}
.caption{font-size:14px;color:#666}.total{font-size:38px;font-weight:800;margin-top:5px}
.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px}
button{min-height:48px;border:0;border-radius:12px;background:#eee;font-size:16px;font-weight:600;cursor:pointer}
.rate{margin-top:22px;padding-top:16px;border-top:1px solid #eee;color:#666;font-size:14px;line-height:1.55}
</style>
</head>
<body>
<div class="app">
<h1>🇦🇷 → 🇨🇱 Conversor</h1>
<div class="sub">Cambio según Banco Falabella</div>

<label for="ars">Pesos argentinos (ARS)</label>
<input id="ars" type="number" min="0" step="1" inputmode="numeric" placeholder="Ej: 42.000">

<div class="result">
<div class="caption">Equivalente en pesos chilenos</div>
<div class="total" id="clp">$0 CLP</div>
</div>

<div class="buttons">
<button type="button" data-v="1000">1.000 ARS</button>
<button type="button" data-v="2000">2.000 ARS</button>
<button type="button" data-v="5000">5.000 ARS</button>
<button type="button" data-v="10000">10.000 ARS</button>
<button type="button" data-v="20000">20.000 ARS</button>
<button type="button" data-v="50000">50.000 ARS</button>
</div>

<div class="rate">
<b>Tasa utilizada</b><br>
2.000 ARS = $1.356 CLP<br>
1 ARS = $0,678 CLP<br><br>
Ingresa cualquier monto y el resultado se calcula automáticamente.
</div>
</div>

<script>
const TASA=0.678;
const input=document.getElementById("ars");
const output=document.getElementById("clp");

function formato(n){
  return new Intl.NumberFormat("es-CL",{maximumFractionDigits:0}).format(Math.round(n));
}
function convertir(){
  const valor=Number(input.value);
  if(!Number.isFinite(valor)||valor<0||input.value===""){
    output.textContent="$0 CLP";
    return;
  }
  output.textContent="$"+formato(valor*TASA)+" CLP";
}
input.addEventListener("input",convertir);
document.querySelectorAll("[data-v]").forEach(b=>{
  b.addEventListener("click",()=>{
    input.value=b.dataset.v;
    convertir();
  });
});
</script>
</body>
</html>
